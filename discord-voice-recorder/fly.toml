# Fly.io デプロイ用テンプレート。app 名とリージョンは自分の環境に合わせて変更してください。
# 事前に: fly launch --no-deploy / fly volumes create recordings --size 1
app = "discord-voice-recorder"
primary_region = "nrt"   # 東京。近いリージョンに変更可。

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  REGISTER_COMMANDS_ON_START = "true"

# 録音を永続化するボリューム（fly volumes create recordings で作成）。
[mounts]
  source = "recordings"
  destination = "/app/recordings"

# 常時稼働のワーカー（HTTP を公開しないので auto stop は無効）。
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
