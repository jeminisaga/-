name: weekly

on:
  schedule:
    # 金 09:00 JST = 金 00:00 UTC : 次節取得 → ベースライン + プロンプト生成
    - cron: "0 0 * * 5"
    # 月 09:00 JST = 月 00:00 UTC : 結果取得 → 採点 → レポート更新
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      job:
        description: "predict / settle"
        required: true
        default: "predict"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jpredict
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: predict
        if: github.event.schedule == '0 0 * * 5' || github.event.inputs.job == 'predict'
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          python -m src.fetch --next
          R=$(python -c "import json,glob;fs=sorted(glob.glob('data/raw/round_*.json'));print(json.load(open(fs[-1]))['round'])")
          python -m src.predict --round $R --arms A B C

      - name: settle
        if: github.event.schedule == '0 0 * * 1' || github.event.inputs.job == 'settle'
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          R=$(python -c "import json,glob;fs=sorted(glob.glob('data/raw/round_*.json'));print(json.load(open(fs[-1]))['round'])")
          python -m src.settle --round $R || true
          python -m src.report || true

      - name: commit
        run: |
          git config user.name "jpredict-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "auto: $(date -u +%FT%TZ)"
          git push
