<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Pet Gatekeeper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="mpg-header">
      <h1>🐾 My Pet Gatekeeper</h1>
    </header>

    <nav class="mpg-tabs" role="tablist">
      <button class="mpg-tab is-active" data-tab="pets" role="tab">うちの子</button>
      <button class="mpg-tab" data-tab="settings" role="tab">設定</button>
      <button class="mpg-tab" data-tab="stats" role="tab">今日の記録</button>
    </nav>

    <main>
      <!-- うちの子タブ -->
      <section class="mpg-panel is-active" data-panel="pets">
        <div class="mpg-pets-grid" id="petsGrid"></div>
        <button class="mpg-add-btn" id="addPetBtn" type="button">+ ペットを追加</button>
        <p class="mpg-hint">最大5匹まで登録できます。すべての写真は端末内に保存され、外部送信されません。</p>
      </section>

      <!-- 設定タブ -->
      <section class="mpg-panel" data-panel="settings">
        <label class="mpg-field">
          <span>今日の乱入ペット</span>
          <select id="todayPetSelect"></select>
        </label>

        <label class="mpg-field">
          <span>使用上限（分）</span>
          <input id="usageLimitInput" type="number" min="1" max="999" />
        </label>

        <label class="mpg-field">
          <span>休憩時間（分）</span>
          <input id="breakMinutesInput" type="number" min="1" max="60" />
        </label>

        <fieldset class="mpg-field">
          <legend>対象サイト</legend>
          <div id="sitesList" class="mpg-sites"></div>
        </fieldset>

        <button class="mpg-save-btn" id="saveSettingsBtn" type="button">保存</button>
        <p class="mpg-saved-msg" id="savedMsg" hidden>保存しました ✓</p>
      </section>

      <!-- 記録タブ -->
      <section class="mpg-panel" data-panel="stats">
        <div class="mpg-stat-cards">
          <div class="mpg-stat-card">
            <div class="mpg-stat-value" id="breakToday">0</div>
            <div class="mpg-stat-label">今日の休憩回数</div>
          </div>
          <div class="mpg-stat-card">
            <div class="mpg-stat-value" id="breakAll">0</div>
            <div class="mpg-stat-label">累計休憩回数</div>
          </div>
        </div>
        <h2 class="mpg-section-h">サイト別使用時間（今日）</h2>
        <ul class="mpg-usage-list" id="usageList"></ul>
      </section>
    </main>

    <!-- 追加ダイアログ -->
    <dialog id="addPetDialog" class="mpg-dialog">
      <form method="dialog" id="addPetForm">
        <h2>ペットを追加</h2>
        <label class="mpg-field">
          <span>写真</span>
          <input id="petImageInput" type="file" accept="image/*" required />
        </label>
        <div class="mpg-preview" id="petPreview" hidden></div>
        <label class="mpg-field">
          <span>名前</span>
          <input id="petNameInput" type="text" maxlength="20" required />
        </label>
        <label class="mpg-field">
          <span>種類</span>
          <select id="petSpeciesSelect"></select>
        </label>
        <div class="mpg-dialog-actions">
          <button type="button" id="cancelAddPet">キャンセル</button>
          <button type="submit" id="confirmAddPet" class="mpg-primary">登録</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="popup.js"></script>
  </body>
</html>
